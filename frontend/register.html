<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — JBizFlow</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="auth-page">

    <!-- Registration Page -->
    <main class="auth-wrapper">

        <div class="auth-grid"></div>

        <div class="auth-orb auth-orb-one"></div>
        <div class="auth-orb auth-orb-two"></div>

        <a href="index.html" class="auth-logo">
            JBiz<span>Flow</span>
        </a>

        <section class="register-container">

            <div class="register-intro">
                <span class="auth-eyebrow">
                    GET STARTED
                </span>

                <h1>
                    Create your
                    <span>workspace.</span>
                </h1>

                <p>
                    Bring your business operations together
                    and start managing everything in one place.
                </p>
            </div>

            <div class="register-card">

                <div class="card-glow"></div>

                <div class="form-header">
                    <h2>Create account</h2>
                    <p>Set up your JBizFlow account to continue.</p>
                </div>

                <form id="registerForm" novalidate>

                    <div class="name-row">

                        <div class="input-group">
                            <label for="firstName">First name</label>

                            <div class="input-wrapper">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M20 21a8 8 0 0 0-16 0"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>

                                <input
                                    type="text"
                                    id="firstName"
                                    name="first_name"
                                    placeholder="Yusuf"
                                    autocomplete="given-name"
                                >
                            </div>

                            <small class="input-error"></small>
                        </div>

                        <div class="input-group">
                            <label for="lastName">Last name</label>

                            <div class="input-wrapper">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M20 21a8 8 0 0 0-16 0"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>

                                <input
                                    type="text"
                                    id="lastName"
                                    name="last_name"
                                    placeholder="Jamal"
                                    autocomplete="family-name"
                                >
                            </div>

                            <small class="input-error"></small>
                        </div>

                    </div>

                    <div class="input-group">
                        <label for="email">Email address</label>

                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="m3 7 9 6 9-6"/>
                            </svg>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                            >
                        </div>

                        <small class="input-error"></small>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="input-wrapper">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="4" y="10" width="16" height="11" rx="2"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            </svg>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a strong password"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >
                                <svg class="eye-open" viewBox="0 0 24 24">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>

                                <svg class="eye-closed" viewBox="0 0 24 24">
                                    <path d="m3 3 18 18"/>
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                                    <path d="M9.9 4.3A10.7 10.7 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-3.1 4.4"/>
                                    <path d="M6.1 6.1C3.5 8.2 2 12 2 12s3.5 8 10 8c1.8 0 3.4-.5 4.8-1.2"/>
                                </svg>
                            </button>
                        </div>

                        <div class="password-strength">
                            <div class="strength-track">
                                <span id="strengthBar"></span>
                            </div>

                            <span id="strengthText">
                                Use 8+ characters
                            </span>
                        </div>

                        <small class="input-error"></small>
                    </div>

                    <label class="terms-check">
                        <input type="checkbox" id="terms" name="terms">

                        <span class="custom-checkbox">
                            <svg viewBox="0 0 24 24">
                                <path d="m5 12 4 4L19 6"/>
                            </svg>
                        </span>

                        <span>
                            I agree to the
                            <a href="#">Terms of Service</a>
                            and
                            <a href="#">Privacy Policy</a>
                        </span>
                    </label>

                    <button type="submit" class="register-button">
                        <span>Create account</span>

                        <svg viewBox="0 0 24 24">
                            <path d="M5 12h14"/>
                            <path d="m13 6 6 6-6 6"/>
                        </svg>
                    </button>

                </form>

                <div class="auth-divider">
                    <span>Already have an account?</span>
                </div>

                <a href="login.html" class="login-link">
                    Sign in to JBizFlow
                    <span>→</span>
                </a>

            </div>

            <p class="auth-footer-text">
                Your business. Better flow.
            </p>

        </section>

    </main>

    <script src="js/register.js"></script>

</body>
</html>
